name: jlcpcb
kind: bom
format: csv
exclude_dnp: true
group_by:
  - LCSC Part #
  - Value
  - Footprint
columns:
  - name: Comment
    source: Value
  - name: Designator
    source: references
  - name: Footprint
    source: Footprint
  - name: LCSC Part #
    source: LCSC Part #
  - name: Quantity
    source: quantity
  - name: Manufacturer Part Number
    source: MPN
  - name: Manufacturer
    source: Manufacturer
notes:
  - "JLCPCB CPL/position file is separate and should eventually be generated by ff cpl/fab."
