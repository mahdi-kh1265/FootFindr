[project]
name = "footfindr"
version = "0.1.0"
description = "CLI-first KiCad footprint resolver, part intelligence, inventory, BOM, and cart tool."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "typer>=0.12",
    "rich>=13.0",
    "pydantic>=2.0",
    "pyyaml>=6.0",
    "httpx>=0.27",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "hypothesis>=6.0",
    "ruff>=0.5",
    "respx>=0.21",
]
ai = [
    "pymupdf>=1.24",
]

[project.scripts]
footfindr = "footfindr.cli:app"
ff = "footfindr.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/footfindr"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
    "live_supplier: marks tests as requiring live supplier credentials",
    "digikey_live: marks tests requiring DigiKey credentials",
    "mouser_live: marks tests requiring Mouser credentials",
    "nexar_live: marks tests requiring Nexar credentials",
    "jlcpcb_live: marks tests requiring JLCPCB credentials",
]
